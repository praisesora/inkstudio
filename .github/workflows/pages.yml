name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types:
      - published
      - edited
      - deleted
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch published GitHub releases metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const repo = process.env.GITHUB_REPOSITORY;
            const token = process.env.GITHUB_TOKEN;
            const url = `https://api.github.com/repos/${repo}/releases?per_page=10`;

            (async () => {
              const res = await fetch(url, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${token}`,
                  "User-Agent": "inkstudio-pages-sync",
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              });

              if (!res.ok) {
                console.error(`GitHub API error: ${res.status} ${res.statusText}`);
                process.exit(1);
              }

              const raw = await res.json();
              const releases = (Array.isArray(raw) ? raw : [])
                .filter((r) => r && !r.draft)
                .map((r) => ({
                  tag_name: String(r.tag_name || ""),
                  name: String(r.name || r.tag_name || ""),
                  published_at: String(r.published_at || ""),
                  prerelease: Boolean(r.prerelease),
                  html_url: String(r.html_url || ""),
                  body: String(r.body || "").slice(0, 4000),
                  assets: (Array.isArray(r.assets) ? r.assets : []).map((a) => ({
                    name: String(a.name || ""),
                    size: Number(a.size || 0),
                    download_count: Number(a.download_count || 0),
                    browser_download_url: String(a.browser_download_url || ""),
                  })),
                }));

              const payload = {
                generatedAt: new Date().toISOString(),
                repo,
                releases,
              };

              fs.writeFileSync("site/releases.json", JSON.stringify(payload, null, 2) + "\n", "utf8");
              console.log(`Synced ${releases.length} published release(s) to site/releases.json`);
            })().catch((err) => {
              console.error(err);
              process.exit(1);
            });
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
